// ============================================
// CS:GO demo recording configuration for 128 tick
// ============================================

// --- Recording core: force 128 tick ---
// Set the GOTV snapshot rate to 128 so demos record at 128 tick (default 32)
tv_snapshotrate 128

// Disable the GOTV bandwidth limit so the snapshot rate is not reduced
tv_maxrate 0

// Transmit all entity data to the demo for complete playback
tv_transmitall 1

tv_deltacache 0
