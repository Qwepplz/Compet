// ============================================
// CS:GO Demo 128tick 录制配置
// ============================================

// --- Demo 录制核心：强制 128tick ---
// 设置 GOTV 快照率为 128，确保 Demo 以 128tick 录制（默认 32）
tv_snapshotrate 128

// 取消 GOTV 带宽限制，防止因带宽不足降低快照率
tv_maxrate 0

// 传输所有实体数据到 Demo，确保完整性
tv_transmitall 1

tv_deltacache 0
